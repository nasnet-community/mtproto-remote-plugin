[package]
name = "mtproto-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deploy a GitHub release binary to a remote server over SSH as a systemd service"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
flate2 = "1.1.10"
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
